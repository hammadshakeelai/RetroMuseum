<!doctype html>
<!--
  Source for docs/banner/readme-banner.png and docs/banner/social-preview.png.
  Render both with headless Chrome from the repo root:

    chrome --headless=new --hide-scrollbars --virtual-time-budget=8000 --force-device-scale-factor=2 --window-size=1280,320 --screenshot=docs/banner/readme-banner.png "file:///<repo>/docs/banner/banner.html?variant=readme"
    chrome --headless=new --hide-scrollbars --virtual-time-budget=8000 --force-device-scale-factor=1 --window-size=1280,640 --screenshot=docs/banner/social-preview.png "file:///<repo>/docs/banner/banner.html?variant=social"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browser Linux Lab banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=VT323&display=block" rel="stylesheet">
<style>
  :root {
    --night: #090b10;    /* the app's background */
    --paper: #e2e8f0;    /* title */
    --slate: #8a97ab;    /* supporting copy */
    --bezel: #1a2130;    /* browser frame */
    --crt: #000000;      /* VGA black */
    --vga-gray: #aaaaaa; /* VGA light gray */
    --vga-cyan: #55ffff; /* VGA bright cyan, the app's accent in 16 colors */
    --h: 320px;
  }
  html.social { --h: 640px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: var(--h); overflow: hidden; background: var(--night); }
  body { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; color: var(--paper); }

  .art { position: relative; width: 1280px; height: var(--h); overflow: hidden; }

  /* Copy */
  .copy { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); width: 572px; }
  h1 { font-weight: 600; font-size: 66px; line-height: 0.95; letter-spacing: -0.01em; white-space: nowrap; }
  .lede { margin-top: 20px; font-size: 27px; line-height: 1.3; color: var(--slate); max-width: 500px; text-wrap: balance; }

  /* Browser window that bleeds off the right and bottom edges */
  .window {
    position: absolute; left: 668px; top: 44px; width: 720px; height: 420px;
    background: var(--bezel); border-radius: 12px 12px 0 0;
    box-shadow: 0 0 0 1px #2a3346, 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .bar { height: 42px; display: flex; align-items: center; padding: 0 14px; }
  .address {
    display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 14px;
    border-radius: 13px; background: #0f141e; color: var(--slate); font-size: 16px;
  }
  .address svg { width: 12px; height: 12px; }

  .screen {
    position: absolute; left: 6px; right: 6px; top: 42px; bottom: 0;
    background: var(--crt); overflow: hidden;
    font-family: "VT323", "Courier New", monospace; color: var(--vga-gray);
    font-size: 27px; line-height: 30px;
    padding: 22px 30px;
  }
  .screen::after { /* faint scanlines, like the app's CRT filter */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 3px);
  }

  .menu { position: relative; border: 5px double var(--vga-gray); padding: 16px 0 10px; width: 520px; }
  .menu-title {
    position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
    padding: 0 10px; background: var(--crt); color: #ffffff; white-space: nowrap;
  }
  .menu li { list-style: none; padding: 0 18px; white-space: nowrap; }
  .menu li.selected { background: var(--vga-cyan); color: #000000; }
  .hint { margin-top: 14px; padding-left: 4px; }
  .cursor { display: inline-block; width: 13px; height: 22px; margin-left: 4px; vertical-align: -3px; background: var(--vga-gray); }

  html.readme .social-only { display: none; }

  /* Social preview: 1280x640 */
  html.social .copy { top: 96px; transform: none; width: 480px; left: 72px; }
  html.social h1 { font-size: 104px; white-space: normal; }
  html.social .lede { margin-top: 28px; font-size: 32px; max-width: 440px; }
  html.social .window { left: 580px; top: 118px; width: 780px; height: 600px; }
  html.social .address { font-size: 18px; height: 30px; }
  html.social .screen { font-size: 31px; line-height: 35px; padding: 34px 36px; }
  html.social .menu { width: 600px; padding: 20px 0 12px; }
  html.social .menu-title { top: -19px; }
</style>
</head>
<body>
<script>
  document.documentElement.className = new URLSearchParams(location.search).get("variant") === "social" ? "social" : "readme";
</script>
<div class="art">
  <div class="copy">
    <h1>Browser <br class="social-only">Linux Lab</h1>
    <p class="lede">Boot real operating systems in a browser tab. No server, no install.</p>
  </div>

  <div class="window">
    <div class="bar">
      <div class="address">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path fill="#8a97ab" d="M3 5V3.5a3 3 0 0 1 6 0V5h.5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1H3Zm1.5 0h3V3.5a1.5 1.5 0 0 0-3 0V5Z"/></svg>
        hammadshakeelai.github.io/WebOS
      </div>
    </div>
    <div class="screen">
      <ul class="menu">
        <span class="menu-title">Choose an operating system</span>
        <li class="selected">Arch Linux 32</li>
        <li>KolibriOS</li>
        <li>FreeDOS 1.3</li>
        <li>Damn Small Linux 4.11</li>
        <li>Micro Linux</li>
        <li class="social-only">Linux 4.x live CD</li>
      </ul>
      <p class="hint social-only">Press Enter to boot<span class="cursor"></span></p>
    </div>
  </div>
</div>
</body>
</html>
